trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**

pool:
  vmImage: ubuntu-latest

variables:
  backendFolderName: 'backend'
  nodeVersion: '22.x'

stages:
  - stage: Build
    displayName: "Build Backend"
    jobs:
      - job: Build
        displayName: "Building Backend"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Installing Node.js'
          - script: |
              npm ci
              npx prisma migrate deploy
              npx prisma generate
              npm run build --if-present
            workingDirectory: '$(System.DefaultWorkingDirectory)/$(backendFolderName)'
            displayName: 'Install Dependencies, Apply Migrations & Build'
            env:
              # Required so `prisma migrate deploy` can reach the database (prisma.config.ts
              # reads DATABASE_URL via dotenv/the environment, not from schema.prisma).
              # Set DATABASE_URL as a secret pipeline variable (or in a linked variable
              # group) — never commit it here.
              #
              # This step is the actual fix for the "column does not exist" / P2022 class
              # of error we hit on /auth/login: previously nothing in this pipeline ever
              # ran `prisma migrate deploy`, so the database could only be migrated by
              # someone running it BY HAND against the shared Azure Postgres instance
              # (see backend/query.md). That decouples "the DB schema changes" from "the
              # app gets redeployed with a matching Prisma Client" — exactly what happened
              # with the User.Username -> User.UserName rename: the DB got migrated by
              # hand, but the already-deployed Web App kept running a Prisma Client built
              # from the OLD schema (mapping to the old column name) until its next
              # redeploy. Running migrate deploy in the same step as prisma generate, on
              # every build, guarantees the DB and the freshly generated client can never
              # drift apart again.
              DATABASE_URL: $(DATABASE_URL)
          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/$(backendFolderName)'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
              replaceExistingArchive: true
            displayName: 'Archive Backend'
            
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend.zip'
              artifact: 'backend-drop'
              publishLocation: 'pipeline'
            displayName: 'Publish Artifact'

  - stage: DeployProduction
    displayName: 'Deploying in Azure'
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployProductionBackend
        displayName: 'Deploy'
        environment: 'Production'

        strategy:
          runOnce:
            deploy:
              steps:

                # Download the artifact published in the Build stage
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Backend Artifact'
                  inputs:
                    buildType: 'current'
                    artifactName: 'backend-drop'
                    targetPath: '$(Pipeline.Workspace)/backend-drop'

                # Deploy the downloaded artifact
                - task: AzureWebApp@1
                  displayName: 'Deploy Azure Web App'
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    appType: 'webAppLinux'
                    appName: '$(AZURE_WEBAPP_NAME)'
                    package: '$(Pipeline.Workspace)/backend-drop/backend.zip'
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'npm start'